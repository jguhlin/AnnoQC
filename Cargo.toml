[package]
name = "AnnoQC"
version = "0.1.1"
edition = "2021"
description = "Production-grade protein sequence quality control using homology, intrinsic metrics, and genomic context"
authors = ["Joseph Guhlin <joseph.guhlin@gmail.com>"]
license = "MIT"
repository = "https://github.com/jguhlin/AnnoQC"
homepage = "https://github.com/jguhlin/AnnoQC"
documentation = "https://jguhlin.github.io/AnnoQC"
keywords = ["bioinformatics", "protein-quality", "sequence-analysis", "homology-search", "qc", "annotation"]
categories = ["science"]
readme = "README.md"
exclude = [
    "book/",
    "examples/",
    "tests/fixtures/",
    "*.fq",
    "*.faa",
    "*.fasta",
    "*.dmnd",
    "*.log",
]

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy_app = "0.17.2"
bevy_ecs = "0.17.2"
mimalloc = { version = "0.1.34", default-features = false }
twox-hash = "1.6.3"
once_cell = "1.17.0"
strum = "0.24.1"
strum_macros = "0.24.3"
pulp = "0.11.5"
itertools = "0.10.5"
clap = { version= "4.1.8", features = ["derive"] }
log = "0.4.17"
env_logger = "0.10.0"
curl = "0.4.44"
needletail = { version = "0.6.3", features = ["compression"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.8"
bevy_tasks = "0.17.2"
futures-lite = "2.2"
regex = "1.10"
flate2 = "1.0"
spoa = "0.2.1"
polars = { version = "0.36.2", features = ["parquet", "lazy"] }
polars-parquet = "0.36.2"
noodles = { version = "0.77.0", features = ["gff", "fasta", "core"] }
extism = "1.0"
rhai = { version = "1.19", features = ["serde", "sync"] }

[dev-dependencies]
proptest = "1.4"
wat = "1.0"

[patch.crates-io]
spoa-sys = { path = "crates/spoa-sys" }
