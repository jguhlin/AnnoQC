# Example config for `cargo run -- analyze --config config.example.toml`

fasta = "input.faa"
db = "uniprot_sprot.dmnd"
threads = 16
approx_id = 50
member_cover = 80
out = "results"
mode = "Auto"
top = 5
diamond_bin = "diamond"
# hmmscan_bin = "/usr/bin/hmmscan"  # optional
mafft_bin = "/usr/bin/mafft"       # optional, enables conserved-region alignment
aligner = "spoa"                  # set to "spoa" to use in-process SPOA aligner
reference_fasta = "uniprot_sprot.fasta.gz"
alignment_top_hits = 5
alignment_strategy = "Auto"
conserved_identity_min = 0.8
alignment_missing_exon = 30
alignment_retained_intron = 30
mafft_threads_per_job = 4
mafft_max_jobs = 2
pfam_db = "share/pfam/Pfam-A.hmm"
pfam_clans = "share/pfam/Pfam-A.clans.tsv"

[scoring.weights]
homology = 0.8
intrinsic = 0.0
taxonomy = 0.0
domains = 0.15
domains_strength = 0.05
domains_order = 0.0
length = 0.05
orphan = 0.0
subject_cov = 0.0
termini = 0.0
divergence = 0.0
conserved_regions = 0.0
block_conservation = 0.0
genomic = 0.0
rnaseq = 0.0

[scoring.thresholds]
high = 0.8
medium = 0.75

[scoring.caps]
# Optional hard caps that cannot be "averaged away" by strong homology/etc.
# These apply pre-calibration when structural-variation signals are detected.
# structvar_fusion_max = 0.15
# structvar_split_max = 0.35
# structvar_dup_max = 0.90

[calibration]
# mode = "Off"  # set to "Percentile" or "Isotonic" to remap final scores
# min_samples = 50
# min_unique = 5

[scoring.homology]
qcov_min = 0.75
scov_min = 0.75
density_min = 1.0
evalue_max = 1e-5

[scoring.intrinsic]
ambiguous_max = 0.05
max_homopolymer = 10

[scoring.genomic]
min_canonical = 0.6
max_noncanonical = 0.3
max_weird = 0.2

[taxonomy]
enabled = false
min_support = 0.75
top_hits = 20
min_consensus = 3
expected_domain = "Eukaryota"        # set to emit non-target domain warnings
# warn_non_target_min_frac = 0.05      # warn if non-target domain >=5% and >=200 hits
# warn_non_target_min_hits = 200
# warn_non_target_strong_frac = 0.10   # strong warn if >=10% and >=500 hits
# warn_non_target_strong_hits = 500
# warn_genus_min_frac = 0.15           # warn if a single genus >=15% and >=300 hits
# warn_genus_min_hits = 300
# low_coverage_frac = 0.05             # note when taxonomy hits <5% of total
# cache_path = "share/uniprot/uniprot_taxonomy.tsv"
# taxdump_dir = "share/taxonomy/new_taxdump"

[rnaseq]
enabled = false
# file = "path/to/quant.tsv"           # Salmon/Kallisto quant table or expression file
# min_tpm = 1.0                        # Minimum TPM threshold for expression support

[consensus]
# Minimum number of homologs required for consensus-based analyses (MAFFT/start, domain architecture)
min_hits = 5
# Maximum homologs to keep after redundancy reduction
max_panel = 20
# Limit per-clade diversity: use lineage element index (0=root,1=superkingdom,2=phylum,3=class,...)
diversity_rank_index = 3
diversity_rank_cap = 3
# Primary filter thresholds; later phases relax automatically when needed
filt_qcov = 0.70
filt_scov = 0.50
filt_evalue = 1e-5
filt_pident = 25.0
# Tight length-ratio window around the query length (±30% by default)
len_ratio_tolerance = 0.30
# Redundancy trimming: limit hits ≥90% identity to the query
redundancy_pident = 90.0
max_high_identity = 3

[hmmer]
top_n = 5
# threads = 4 # optional override; defaults to global --threads
orphan_analysis = true

[diamond]
# When diamond_mode = "Auto", Single is used up to this threshold
auto_threshold = 200000
