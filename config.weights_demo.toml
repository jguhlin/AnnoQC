[scoring.weights]
homology = 0.5
intrinsic = 0.3
taxonomy = 0.0
domains = 0.1
domains_strength = 0.05
length = 0.1
orphan = 0.0
subject_cov = 0.0
termini = 0.0
divergence = 0.0
conserved_regions = 0.1
genomic = 0.0

[calibration]
mode = "Off"

[consensus]
min_hits = 5
max_panel = 15
diversity_rank_index = 3
diversity_rank_cap = 3
filt_qcov = 0.70
filt_scov = 0.50
filt_evalue = 1e-5
filt_pident = 25.0
len_ratio_tolerance = 0.30
redundancy_pident = 90.0
max_high_identity = 3

alignment_strategy = "Fast"
alignment_missing_exon = 30
alignment_retained_intron = 30
mafft_threads_per_job = 2
mafft_max_jobs = 6
render_max_jobs = 12
pfam_db = "share/pfam/Pfam-A.hmm"
pfam_clans = "share/pfam/Pfam-A.clans.tsv"

[taxonomy]
enabled = false
min_support = 0.75
top_hits = 20
min_consensus = 3

# Structural variation defaults tuned from head200 summary (fusion gap≈160 aa, subject coverage≈0.27)
[structvar]
min_hsp_len = 50
min_hsp_frac = 0.20
fusion_min_gap = 160
dup_max_gap = 20
split_delta = 0.30
min_subject_cov = 0.27
orient_majority = 0.70

[hmmer]
orphan_analysis = true
